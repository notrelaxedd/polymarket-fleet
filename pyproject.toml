[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-fleet"
version = "0.1.0"
description = "Multi-machine fleet for NFL prediction-market models: Postgres job queue, worker agents, host-enforced trading limits, dashboard"
requires-python = ">=3.11"
# The worker package (fleet/) must stay dependency-free: it runs on 4 GB Debian boxes from the system python3.
dependencies = []

[project.optional-dependencies]
host = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pynacl>=1.5",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["fleet*", "host*"]

[tool.setuptools.package-data]
host = ["migrations/*.sql", "templates/*.html", "templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
