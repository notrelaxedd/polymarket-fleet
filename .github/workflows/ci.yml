name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLEET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[host,dev]'
      - run: python -m pytest

  worker-stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile fleet/ and fleetagent/
        run: python3.11 -m compileall -q fleet fleetagent
      - name: Assert fleet/ and fleetagent/ import only the standard library
        run: |
          python3.11 - <<'PY'
          import re
          import subprocess
          import sys

          # Each package may import itself and the standard library, nothing else (the
          # machine agent must not import the worker package either: it ships alone).
          failed = False
          for package in ("fleet", "fleetagent"):
              out = subprocess.run(
                  ["grep", "-rhE", "^(import|from) ", "--include=*.py", package + "/"],
                  capture_output=True, text=True,
              ).stdout
              bad = set()
              for line in out.splitlines():
                  m = re.match(r"^(?:import|from)\s+([A-Za-z_][\w]*)", line)
                  if not m:
                      continue  # relative import such as "from . import x"
                  name = m.group(1)
                  if name != package and name not in sys.stdlib_module_names:
                      bad.add(name)
              if bad:
                  print(f"non-stdlib imports in {package}/:", sorted(bad))
                  failed = True
              else:
                  print(f"{package}/ imports only stdlib")
          sys.exit(1 if failed else 0)
          PY
