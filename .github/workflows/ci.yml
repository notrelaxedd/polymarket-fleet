name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLEET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[host,dev]'
      - run: python -m pytest

  worker-stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile fleet/
        run: python3.11 -m compileall -q fleet
      - name: Assert fleet/ imports only the standard library
        run: |
          python3.11 - <<'PY'
          import re
          import subprocess
          import sys

          out = subprocess.run(
              ["grep", "-rhE", "^(import|from) ", "--include=*.py", "fleet/"],
              capture_output=True, text=True,
          ).stdout
          bad = set()
          for line in out.splitlines():
              m = re.match(r"^(?:import|from)\s+([A-Za-z_][\w]*)", line)
              if not m:
                  continue  # relative import such as "from . import x"
              name = m.group(1)
              if name != "fleet" and name not in sys.stdlib_module_names:
                  bad.add(name)
          if bad:
              print("non-stdlib imports in fleet/:", sorted(bad))
              sys.exit(1)
          print("fleet/ imports only stdlib")
          PY
