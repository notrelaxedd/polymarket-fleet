<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fleet{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header id="topbar" class="topbar{% if topbar.killed %} killed{% endif %}">
  <div class="topbar-row">
    <a class="wordmark" href="/">Fleet</a>
    <nav class="nav" aria-label="Sections">
      <a href="/" data-nav="fleet"{% if path == '/' %} class="active" aria-current="page"{% endif %}>Fleet</a>
      <a href="/jobs" data-nav="jobs"{% if path.startswith('/jobs') %} class="active" aria-current="page"{% endif %}>Jobs</a>
      <a href="/models" data-nav="models"{% if path.startswith('/models') %} class="active" aria-current="page"{% endif %}>Models</a>
      <a href="/trading" data-nav="trading"{% if path.startswith('/trading') %} class="active" aria-current="page"{% endif %}>Trading</a>
      <a href="/settings" data-nav="settings"{% if path.startswith('/settings') %} class="active" aria-current="page"{% endif %}>Settings</a>
    </nav>
    <div id="topbar-status" class="status">
{% include "_topbar.html" %}
    </div>
  </div>
  <div class="topbar-note"><span id="updated" class="muted"></span></div>
</header>
<form id="kill-form" method="post" action="/kill" data-form="kill" hidden></form>
<main class="page" data-page="{% block page %}{% endblock %}">
{% if flash %}
  <div class="flash" role="status" data-flash>{{ flash }}</div>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
