services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    volumes:
      - fleet-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  host:
    build: .
    restart: unless-stopped
    # secrets.env (optional, host only) holds FLEET_SECRETS_KEY for workload secrets.
    env_file:
      - .env
      - path: secrets.env
        required: false
    environment:
      DATABASE_URL: postgresql://fleet:fleet@db:5432/fleet
      FLEET_BIND: 0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  exchange:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "host.exchange.main"]
    env_file:
      - .env
      - path: exchange.env
        required: false
    environment:
      DATABASE_URL: postgresql://fleet:fleet@db:5432/fleet
    depends_on:
      db:
        condition: service_healthy

  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - fleet-registry:/var/lib/registry

volumes:
  fleet-db:
  fleet-registry:
